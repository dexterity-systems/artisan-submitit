name: artisan-submitit

services:
  slurm:
    build: .
    image: artisan-submitit-slurm:dev
    init: true
    hostname: slurm-node
    working_dir: /workspace/artisan-submitit
    volumes:
      - ..:/workspace/artisan-submitit
      - ${ARTISAN_WORKTREE:-../../artisan}:/workspace/artisan
      - pixi-env:/pixi-env
    environment:
      ARTISAN_DOCKER_GID: ${ARTISAN_DOCKER_GID:-1000}
      ARTISAN_DOCKER_UID: ${ARTISAN_DOCKER_UID:-1000}
      ARTISAN_WORKTREE: /workspace/artisan
      PYTHONPATH: /workspace/artisan/src:/workspace/artisan-submitit/src:/workspace/artisan-submitit
      PYTHONDONTWRITEBYTECODE: "1"
      SLURM_TEST_PARTITION: debug
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /run/artisan-submitit-ready && squeue --noheader",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    tty: true
    stdin_open: true

volumes:
  pixi-env:
