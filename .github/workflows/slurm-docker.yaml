name: SLURM Docker

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - docker/**
      - src/**
      - scripts/verify_sources.py
      - tests/integration/**
      - docs/tutorials/**
      - pyproject.toml
      - pixi.lock
      - .github/workflows/slurm-docker.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slurm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'test-slurm')
    runs-on: ubuntu-latest
    env:
      ARTISAN_WORKTREE: ${{ github.workspace }}/artisan
      ARTISAN_CORE_REF: main
      PIXI_LOCKED: "1"
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v6
        with:
          path: artisan-submitit
      - uses: actions/checkout@v6
        with:
          repository: andrewcolinhunt/artisan-dev
          ref: ${{ env.ARTISAN_CORE_REF }}
          path: artisan
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          locked: true
      - name: Configure container ownership
        run: |
          echo "ARTISAN_DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "ARTISAN_DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate Compose mounts
        run: |
          docker compose -f docker/docker-compose.yml config --format json | python -c 'import json, os, sys; mounts = json.load(sys.stdin)["services"]["slurm"]["volumes"]; assert any(mount.get("source") == os.environ["ARTISAN_WORKTREE"] and mount["target"] == "/workspace/artisan" for mount in mounts)'
      - name: Build cluster
        run: pixi run --locked slurm-build
      - name: Start cluster
        run: pixi run --locked slurm-up
      - name: Install locked environment
        run: pixi run --locked slurm-install
      - name: Verify container source pair
        run: docker compose -f docker/docker-compose.yml exec -T -u docker slurm pixi run --locked -e dev python scripts/verify_sources.py /workspace/artisan /workspace/artisan-submitit "$ARTISAN_CORE_REF"
      - name: Test sbatch runner
        run: pixi run --locked slurm-test-sbatch
      - name: Test srun runner
        run: pixi run --locked slurm-test-srun
      - name: Install locked tutorial environment
        run: docker compose -f docker/docker-compose.yml exec -T -u docker slurm /usr/local/bin/pixi install --locked -e tutorials
      - name: Execute sbatch tutorials
        run: docker compose -f docker/docker-compose.yml exec -T -u docker -e ARTISAN_SLURM_PARTITION=debug slurm env -u PYTHONPATH /usr/local/bin/pixi run --locked -e tutorials test-tutorial-sbatch
      - name: Execute srun tutorial
        run: docker compose -f docker/docker-compose.yml exec -T -u docker -e ARTISAN_SLURM_PARTITION=debug slurm env -u PYTHONPATH /usr/local/bin/pixi run --locked -e tutorials test-tutorial-srun
      - name: Retain executed tutorials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-tutorials
          path: artisan-submitit/slurm_logs/tutorials/**/*.ipynb
      - name: Stop cluster
        if: always()
        run: pixi run --locked slurm-down
