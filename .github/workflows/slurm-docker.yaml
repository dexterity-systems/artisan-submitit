name: SLURM Docker

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - docker/**
      - src/**
      - tests/integration/**
      - pyproject.toml
      - pixi.lock
      - .github/workflows/slurm-docker.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slurm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'test-slurm')
    runs-on: ubuntu-latest
    env:
      ARTISAN_WORKTREE: ../artisan
      PIXI_LOCKED: "1"
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v7
        with:
          path: artisan-submitit
      - uses: actions/checkout@v7
        with:
          repository: dexterity-systems/artisan
          path: artisan
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          locked: true
      - name: Configure container ownership
        run: |
          echo "ARTISAN_DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "ARTISAN_DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build cluster
        run: pixi run --locked slurm-build
      - name: Start cluster
        run: pixi run --locked slurm-up
      - name: Install locked environment
        run: pixi run --locked slurm-install
      - name: Test sbatch runner
        run: pixi run --locked slurm-test-sbatch
      - name: Test srun runner
        run: pixi run --locked slurm-test-srun
      - name: Stop cluster
        if: always()
        run: pixi run --locked slurm-down
