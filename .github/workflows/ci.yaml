name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_LOCKED: "1"
  ARTISAN_CORE_REF: ea7bf621b4e2e293d3e6c7c1f82099e44fe48bd8

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v6
        with:
          path: artisan-submitit
      - uses: actions/checkout@v6
        with:
          repository: andrewcolinhunt/artisan-dev
          ref: ${{ env.ARTISAN_CORE_REF }}
          path: artisan
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          environments: dev
          locked: true
      - name: Lint
        run: pixi run --locked -e dev fmt
      - name: Check for lint changes
        run: git diff --exit-code

  pre-commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v6
        with:
          path: artisan-submitit
      - uses: actions/checkout@v6
        with:
          repository: andrewcolinhunt/artisan-dev
          ref: ${{ env.ARTISAN_CORE_REF }}
          path: artisan
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          environments: dev
          locked: true
      - name: Run pre-commit
        run: pixi run --locked -e dev pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v6
        with:
          path: artisan-submitit
      - uses: actions/checkout@v6
        with:
          repository: andrewcolinhunt/artisan-dev
          ref: ${{ env.ARTISAN_CORE_REF }}
          path: artisan
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          environments: dev
          locked: true
      - name: Verify source pair
        run: pixi run --locked -e dev python scripts/verify_sources.py ../artisan . "$ARTISAN_CORE_REF"
      - name: Type check
        run: pixi run --locked -e dev typecheck
      - name: Run unit tests
        run: pixi run --locked -e dev test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v6
        with:
          path: artisan-submitit
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: andrewcolinhunt/artisan-dev
          ref: ${{ env.ARTISAN_CORE_REF }}
          path: artisan
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          environments: dev
          locked: true
      - name: Build distribution
        run: pixi run --locked -e dev build-dist
      - name: Check distribution
        run: pixi run --locked -e dev check-dist
      - name: Build candidate core wheel with temporary release version
        run: pixi run --locked -e dev env SETUPTOOLS_SCM_PRETEND_VERSION=0.2.0 python -m build --wheel --outdir ../artisan/dist ../artisan
      - name: Qualify installed candidate distributions
        run: pixi run --locked -e dev smoke-dist dist/*.whl --core-wheel ../artisan/dist/*.whl

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artisan-submitit
    steps:
      - uses: actions/checkout@v6
        with:
          path: artisan-submitit
      - uses: actions/checkout@v6
        with:
          repository: andrewcolinhunt/artisan-dev
          ref: ${{ env.ARTISAN_CORE_REF }}
          path: artisan
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          manifest-path: artisan-submitit/pyproject.toml
          pixi-version: v0.66.0
          environments: docs
          locked: true
      - name: Build documentation
        run: pixi run --locked -e docs docs-build
